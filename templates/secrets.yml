# Secret scan on every pull request. Copied verbatim from punchlist/templates/secrets.yml; change
# it there. Make it a required check in the main ruleset.
# No run on push to main: the PR run already scanned the merge result, and the ruleset blocks
# direct pushes. Each run bills a full minute for a ten-second scan.
# A finding fails the check; remove the secret from the branch and rotate it, since it was pushed.
name: secrets

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Free for repositories owned by a personal account; an organization needs a GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
