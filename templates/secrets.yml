# Secret scan on every pull request and every push to main. Copied verbatim from
# punchlist/templates/secrets.yml; change it there. Make it a required check in the main ruleset.
# A finding fails the check; remove the secret from the branch and rotate it, since it was pushed.
name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Free for repositories owned by a personal account; an organization needs a GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
